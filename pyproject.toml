[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medaudit"
version = "0.1.0"
description = "Bangladeshi prescription-audit decision-support prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "huggingface_hub",
    "pydantic>=2.0",
    "fastapi",
    "uvicorn",
    "rapidfuzz",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
